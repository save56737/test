<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone - Web Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content auth-modal">
            <span class="close-modal">&times;</span>
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Log In</button>
                <button class="tab-btn" data-tab="register">Sign Up</button>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2>Log in to Spotify</h2>
                <div class="form-group">
                    <label for="loginEmail">Email or username</label>
                    <input type="text" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <p class="auth-error"></p>
            </form>
            
            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <h2>Sign up for Spotify</h2>
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required minlength="6">
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
                <p class="auth-error"></p>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <svg viewBox="0 0 1134 342" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 171c0 94.39 76.61 171 171 171s171-76.61 171-171S273.39 0 179 0 8 76.61 8 171zm248.82 78.27l-47.2-28.82c-65.05-39.75-146.83-48.71-243.06-26.62l-10.76-46.85c109.42-25.09 204.01-14.24 280.48 32.4l47.2 28.82c6.82 4.17 8.98 13.08 4.81 19.9-4.17 6.82-13.08 8.98-19.9 4.81l-11.57-7.07zm26.52-61.37c-80.67-50.27-203.77-64.81-301.2-35.53l-12.48-46.35c111.42-33.51 247.37-17.35 339.32 40.07 7.51 4.7 9.8 14.6 5.1 22.11-4.7 7.51-14.6 9.8-22.11 5.1l-8.63-5.4zm1.44-63.45c-94.38-56.01-250.25-61.13-334.25-34.71L-64.5 66.53c96.58-30.35 264.45-24.5 369.32 37.67 7.67 4.54 10.2 14.42 5.66 22.09-4.54 7.67-14.42 10.2-22.09 5.66l-8.37-4.96z"/>
                </svg>
                <span>Spotify Clone</span>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="nav-link active" data-page="home"><span class="icon">🏠</span>Home</a></li>
                    <li><a href="#" class="nav-link" data-page="search"><span class="icon">🔍</span>Search</a></li>
                    <li><a href="#" class="nav-link" data-page="library"><span class="icon">📚</span>Your Library</a></li>
                </ul>
                
                <div class="playlist-section">
                    <div class="playlist-header">
                        <span>Playlists</span>
                        <button id="createPlaylistBtn" class="icon-btn">+</button>
                    </div>
                    <ul id="userPlaylists" class="playlist-list">
                        <!-- Playlists will be loaded here -->
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="nav-arrows">
                    <button id="backBtn" class="arrow-btn">◀</button>
                    <button id="forwardBtn" class="arrow-btn">▶</button>
                </div>
                <div class="user-menu">
                    <button id="authBtn" class="btn-primary">Log In</button>
                    <div id="userProfile" class="user-profile" style="display: none;">
                        <img id="userAvatar" src="" alt="User">
                        <span id="userName"></span>
                        <button id="logoutBtn" class="btn-secondary">Logout</button>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div id="pageContent" class="page-content">
                <!-- Home Page -->
                <div id="homePage" class="page active">
                    <section class="greeting-section">
                        <h1 id="greeting">Good morning</h1>
                    </section>
                    
                    <section class="cards-section">
                        <h2>Recently Played</h2>
                        <div id="recentlyPlayed" class="card-grid">
                            <!-- Cards will be loaded here -->
                        </div>
                    </section>

                    <section class="cards-section">
                        <h2>Made For You</h2>
                        <div id="madeForYou" class="card-grid">
                            <!-- Cards will be loaded here -->
                        </div>
                    </section>

                    <section class="cards-section">
                        <h2>Popular Artists</h2>
                        <div id="popularArtists" class="card-grid">
                            <!-- Cards will be loaded here -->
                        </div>
                    </section>
                </div>

                <!-- Search Page -->
                <div id="searchPage" class="page">
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="What do you want to listen to?">
                    </div>
                    <div id="searchResults" class="search-results">
                        <!-- Search results will be shown here -->
                    </div>
                </div>

                <!-- Library Page -->
                <div id="libraryPage" class="page">
                    <h1>Your Library</h1>
                    <div class="library-tabs">
                        <button class="tab-btn active" data-library="playlists">Playlists</button>
                        <button class="tab-btn" data-library="liked">Liked Songs</button>
                    </div>
                    <div id="libraryContent" class="library-content">
                        <!-- Library content will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Player Bar -->
    <footer class="player-bar">
        <div class="now-playing">
            <img id="currentTrackImage" src="" alt="Track" class="track-image">
            <div class="track-info">
                <div id="currentTrackTitle" class="track-title">No track playing</div>
                <div id="currentTrackArtist" class="track-artist"></div>
            </div>
            <button id="likeBtn" class="icon-btn">♡</button>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
                <button id="shuffleBtn" class="control-btn">🔀</button>
                <button id="prevBtn" class="control-btn">⏮</button>
                <button id="playPauseBtn" class="control-btn play-btn">▶</button>
                <button id="nextBtn" class="control-btn">⏭</button>
                <button id="repeatBtn" class="control-btn">🔁</button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>
        </div>
        
        <div class="volume-controls">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeBar" min="0" max="100" value="70">
        </div>
    </footer>

    <!-- Audio Element -->
    <audio id="audioPlayer"></audio>

    <script src="js/app.js"></script>
</body>
</html>
